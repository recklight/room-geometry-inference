[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "room-geometry-inference"
version = "0.1.0"
description = "Room geometry from a single microphone: image-source simulation, NLMS identification of the impulse response, first-order echo inversion for room size and source distance, and cross-validated room-size classification."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RL" }]
maintainers = [{ name = "RL" }]
keywords = [
    "room-acoustics",
    "room-impulse-response",
    "image-source-method",
    "adaptive-filter",
    "echo-labeling",
    "room-geometry",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
# Every module-level import is listed, even joblib, which scikit-learn already
# pulls in.
dependencies = [
    "speechdsp>=0.2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "joblib>=1.2",
]

[project.optional-dependencies]
# PyTorch models; imported lazily, so the package and its scikit-learn models work without it.
dl = ["torch>=2.2"]
dev =["pytest>=7.2", "ruff>=0.4"]

[project.scripts]
room-geometry-inference = "room_geometry_inference.cli:main"

[project.urls]
Homepage = "https://github.com/recklight/room-geometry-inference"
Repository = "https://github.com/recklight/room-geometry-inference"
Issues = "https://github.com/recklight/room-geometry-inference/issues"
Changelog = "https://github.com/recklight/room-geometry-inference/blob/master/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
room_geometry_inference = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.2"
testpaths = ["tests", "src"]
# "src" makes the package importable straight from a checkout, without installing.
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config --doctest-modules"
# Unit tests train tiny networks for a handful of iterations on purpose.
filterwarnings = ["ignore::sklearn.exceptions.ConvergenceWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "examples"]

[tool.ruff.format]
# Ruff 0.16+ also formats code blocks in Markdown; the README examples are aligned by hand.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
# Documentation tests and interface text are Traditional Chinese, which uses
# full-width punctuation.
allowed-confusables = ["（", "）", "，", "：", "；", "！", "？", "／"]
